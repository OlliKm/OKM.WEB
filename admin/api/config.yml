backend:
  name: github
  repo: OlliKm/OKM.WEB  # Make sure this matches your actual GitHub repo
  branch: main
  base_url: https://ollikm.com
  auth_endpoint: api/auth            # This targets functions/auth.js

media_folder: "images/uploads"
public_folder: "images/uploads"

collections:
  - name: "blog"
    label: "Blog Posts"
    folder: "content/blog"
    create: true
    fields:
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Publish Date", name: "date", widget: "datetime"}
      - {label: "Featured Image", name: "image", widget: "image", required: false}
      - {label: "Body", name: "body", widget: "markdown"}