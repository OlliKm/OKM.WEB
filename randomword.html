<html lang="en">
<head>

<style>
:root{--ink:#0b0f26;--ink2:#1a2150;--glass:#bcd4ff;--brass:#c9a24d;--gold:#f6c83d;--text:#e8ecf8;--muted:#9aa3c7;
--serif:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;--ui:system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--text);font-family:var(--serif);padding:20px 14px 40px;
background:radial-gradient(ellipse at 50% -10%,var(--ink2),var(--ink) 70%) fixed}
main{max-width:1600px;margin:0 auto}
.layout{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(320px,1fr);gap:0 24px;align-items:start}
.left,.right{min-width:0}
.right>:first-child{margin-top:0}
.right{position:sticky;top:14px;max-height:calc(100vh - 28px);overflow-y:auto;padding-right:4px}
h1{font-size:1.05rem;font-weight:400;color:var(--muted);text-align:center;margin:0 0 14px;letter-spacing:.04em}
#identity{border:1px solid var(--brass);border-radius:6px;padding:18px 16px;text-align:center;min-height:136px;
background:rgba(255,255,255,.03);display:flex;flex-direction:column;justify-content:center;gap:10px}
.hint{color:var(--muted);margin:0}
.merged{display:flex;justify-content:center;align-items:baseline;gap:16px;flex-wrap:wrap}
.w{font-size:clamp(1.6rem,5vw,2.6rem);font-weight:600}
.hw{color:var(--glass);animation:inL .6s ease both}
.sw{color:var(--gold);animation:inR .6s ease both}
.join{color:var(--brass)}
.defs{display:flex;gap:20px;justify-content:center;flex-wrap:wrap;font-size:.95rem;line-height:1.4;color:var(--muted)}
.defs p{margin:0;max-width:34ch}
.interp{margin:0;font-size:1.05rem}
.ruling{margin:0;color:var(--brass);font-size:.95rem}
.acts{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
@keyframes inL{from{opacity:0;transform:translateX(-36px)}}
@keyframes inR{from{opacity:0;transform:translateX(36px)}}
#scale{position:relative;display:grid;grid-template-columns:minmax(0,1fr) 130px minmax(0,1fr);gap:0 8px;margin-top:18px;padding-bottom:30px}
#beam{position:absolute;top:0;height:6px;border-radius:3px;background:linear-gradient(var(--brass),#8a6d2f);
transition:transform 1s cubic-bezier(.3,1.4,.5,1);z-index:1}
.mid{position:relative;display:flex;flex-direction:column;align-items:center}
.mid::before{content:"";position:absolute;top:-6px;width:18px;height:18px;border-radius:50%;background:var(--brass);z-index:2}
.pillar{width:3px;flex:1;background:linear-gradient(var(--brass),#8a6d2f)}
#go{font:.95rem var(--ui);white-space:nowrap;padding:12px 18px;border:1px solid var(--brass);border-radius:999px;background:var(--ink);color:var(--text);cursor:pointer}
#go:hover{background:var(--brass);color:var(--ink)}
.pan{position:relative;align-self:start;margin-top:46px;border:1px solid rgba(201,162,77,.45);border-top:2px solid var(--brass);
border-radius:0 0 34px 34px;padding:14px 12px 22px;display:flex;flex-direction:column;gap:10px;background:rgba(255,255,255,.025);
transition:transform 1s cubic-bezier(.3,1.4,.5,1)}
.pan::before{content:"";position:absolute;left:50%;top:-48px;height:46px;width:1px;background:var(--brass)}
.pan h2{margin:0;font-size:.85rem;font-weight:400;color:var(--muted);text-align:center}
.cw{display:flex;flex-direction:column;gap:6px}
.card{width:100%;border:1px solid rgba(188,212,255,.25);border-radius:8px;padding:10px 12px;background:rgba(11,15,38,.6);color:var(--text);font:inherit;text-align:left}
.heaven .card{border-color:var(--glass)}
.heaven .word{color:var(--glass)}
.word{font-size:1.3rem;font-weight:600}
.meta{font-size:.9rem;line-height:1.4;color:var(--muted);margin-top:4px}
button.card{cursor:pointer;transition:background .25s,color .25s,border-color .25s}
button.card:hover{border-color:var(--gold)}
button.card[aria-pressed=true]{background:var(--gold);border-color:var(--gold);color:#241b00}
button.card[aria-pressed=true] .meta{color:#4a3a08}
.tools{display:flex;gap:6px;flex-wrap:wrap}
.tb,.rr{font:.78rem var(--ui);color:var(--muted);background:none;border:1px solid rgba(201,162,77,.45);border-radius:999px;padding:5px 11px;cursor:pointer}
.rr{align-self:center;font-size:.85rem;padding:8px 14px}
.tb:hover,.rr:hover{color:var(--text);border-color:var(--brass)}
button:focus-visible,summary:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
section.box,details{margin-top:18px;border:1px solid rgba(201,162,77,.45);border-radius:6px;padding:14px}
section.box h2{margin:0 0 10px;font-size:.95rem;font-weight:400;color:var(--muted)}
label{color:var(--muted);font-size:.95rem}
textarea,select{font:1rem var(--serif);color:var(--text);background:rgba(11,15,38,.6);border:1px solid rgba(188,212,255,.25);border-radius:8px;padding:8px}
textarea{width:100%;resize:vertical;margin-top:8px}
select{font:.85rem var(--ui)}
summary{cursor:pointer;color:var(--muted)}
.pool{margin-top:12px;display:flex;gap:14px 18px;flex-wrap:wrap;align-items:center;font:.85rem var(--ui);color:var(--muted)}
.item{border-top:1px solid rgba(201,162,77,.25);padding:10px 0;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.item p{margin:0}
.w2{font-weight:600}
@media(max-width:900px){
.layout{grid-template-columns:1fr}
.right{position:static;max-height:none;overflow:visible}
.right>:first-child{margin-top:18px}
}
@media(max-width:640px){
#scale{grid-template-columns:1fr;gap:14px;padding-bottom:0}
#beam,.pan::before,.pillar,.mid::before{display:none}
.pan{margin-top:0}
.mid{align-items:stretch}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main>
<h1>Cosmic lawyers' scale</h1>
<div class="layout">
<div class="left">
<section id="identity" aria-live="polite"><p class="hint">Loading words...</p></section>
<section id="scale">
  <div id="beam"></div>
  <div class="pan heaven" id="lp"><h2>Heaven word</h2><div id="hbody"></div></div>
  <div class="mid"><div class="pillar"></div><button id="go" type="button">Draw words</button></div>
  <div class="pan" id="rp"><h2>Self words: choose the one that means something to you</h2><div id="sbody" style="display:flex;flex-direction:column;gap:12px"></div><button class="rr" id="rs" type="button">Reroll all self words</button></div>
</section>
</div>
<div class="right">
<section class="box">
  <label for="interp">Identity: how do the two words combine, and how does it shape your soul-light?</label>
  <textarea id="interp" rows="3" placeholder="Write the ability these two words form together"></textarea>
  <label for="cost" style="display:block;margin-top:10px">Cost: what does it drain, limit or risk?</label>
  <textarea id="cost" rows="2" placeholder="e.g. holding the effect drains Size the whole time"></textarea>
  <label for="drift" style="display:block;margin-top:10px">Drift: how does it change the bearer over time?</label>
  <textarea id="drift" rows="2" placeholder="e.g. they grow more obsessed with fairness"></textarea>
</section>
<section class="box"><h2>Saved identities</h2><div class="acts" id="sx" style="justify-content:flex-start;margin-bottom:8px"></div><div id="list"></div></section>
<details id="opts"><summary>Word pool and lists</summary>
  <div class="pool">
    <label><input type="checkbox" id="tn" checked> Nouns</label>
    <label><input type="checkbox" id="tv" checked> Verbs</label>
    <label><input type="checkbox" id="ta"> Adjectives</label>
    <label>Word source <select id="src"><option value="cur" selected>Curated (best)</option><option value="mix">Mixed</option><option value="dict">Whole dictionary</option></select></label>
    <label>Self words offered <select id="nself"><option value="3">3</option><option value="4">4</option><option value="5" selected>5</option></select></label>
    <label>Dictionary heaven words <select id="hs"><option value="1" selected>Abstract only</option><option value="2">Power-friendly</option><option value="3">Elemental only</option></select></label>
    <label>Dictionary self words <select id="ss"><option value="1">Abstract only</option><option value="2" selected>Power-friendly</option><option value="3">Elemental only</option></select></label>
    <label>Rarity <select id="zip"><option value="4.2">Everyday</option><option value="3.6" selected>Common</option><option value="3.2">Wide</option></select></label>
    <label>Length <select id="len"><option value="99">Any</option><option value="8">Up to 8</option><option value="6">Up to 6</option></select></label>
    <button class="tb" id="clr" type="button">Clear bans</button>
    <span id="count"></span>
  </div>
  <label for="mine" style="display:block;margin-top:14px">My shards (one word per line; the Save button on a card adds to this list)</label>
  <textarea id="mine" rows="4" placeholder="census&#10;veto"></textarea>
  <label style="display:block;margin-top:8px"><input type="checkbox" id="only"> Draw only from my shards</label>
</details>
</div>
</div>
</main>

let DATA = [], IDX = new Map(), heaven, selves = [], pick = -1, ang = -6;

function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined) n.textContent = text;
  return n;
}
function btn(text, fn, cls) {
  const b = el("button", cls || "tb", text);
  b.type = "button";
  b.onclick = () => fn(b);
  return b;
}
async function load() {
  const bytes = Uint8Array.from(atob(PACK), c => c.charCodeAt(0));
  const res = new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip")));
  DATA = await res.json();
  IDX = new Map(DATA.map(e => [e[0], e]));
}
const types = () => ({n: $("tn").checked, v: $("tv").checked, a: $("ta").checked, c: true});
const first = (e, t) => e[3].findIndex(s => t[s[0]]);
const mine = () => [...new Set($("mine").value.toLowerCase().split(/[,\n]+/).map(x => x.trim()).filter(Boolean))];
const bans = () => new Set(store.get("bans", []));
const sd = it => it.e[3][it.i][1];

function poolFor(side) {
  const t = types(), b = bans();
  if ($("only").checked) return mine().filter(w => !b.has(w)).map(w => IDX.get(w) || [w, 0, 1, [["c", "Custom shard"]]]);
  const st = +$(side + "s").value, z = +$("zip").value, n = +$("len").value;
  return DATA.filter(e => e[1] >= z && e[0].length <= n && !b.has(e[0]) && (st === 2 || e[2] === (st === 1 ? 1 : 2)) && first(e, t) >= 0);
}
const curated = side => DATA.filter(e => e[4] === (side === "h" ? 1 : 2) && !bans().has(e[0]));
function one(side, avoid) {
  const src = $("src").value;
  let p = !$("only").checked && (src === "cur" || (src === "mix" && Math.random() < .7)) ? curated(side) : poolFor(side);
  if (!p.length) p = poolFor(side);
  const t = types();
  for (let k = 0; p.length && k < 500; k++) {
    const e = p[Math.floor(Math.random() * p.length)];
    if (!avoid.includes(e[0])) return {e, i: Math.max(0, first(e, t))};
  }
  return null;
}
function shown() { return [heaven, ...selves].filter(Boolean).map(x => x.e[0]); }
function fourSelves(used) {
  const s = [];
  while (s.length < +$("nself").value) {
    const x = one("s", used);
    if (!x) break;
    used.push(x.e[0]); s.push(x);
  }
  return s;
}
function draw() {
  $("count").textContent = "Curated: " + curated("h").length + " heaven, " + curated("s").length + " self. Dictionary: " + poolFor("h").length.toLocaleString() + " heaven, " + poolFor("s").length.toLocaleString() + " self";
  const h = one("h", []);
  const s = h ? fourSelves([h.e[0]]) : [];
  if (!h || s.length < +$("nself").value) {
    $("identity").replaceChildren(el("p", "hint", DATA.length ? "Not enough words match these settings. Loosen the pool or add more shards." : "Loading words..."));
    return;
  }
  heaven = h; selves = s; pick = -1;
  clearCase();
  renderAll();
}
function flash(b, text) {
  const old = b.dataset.t || b.textContent;
  b.dataset.t = old;
  b.textContent = text;
  clearTimeout(b.tm);
  b.tm = setTimeout(() => { b.textContent = old; }, 1500);
}
function clearCase() { ["interp", "cost", "drift"].forEach(id => { $(id).value = ""; }); }
function rerollH() { const x = one("h", shown()); if (x) { heaven = x; clearCase(); renderAll(); } }
function rerollS(i) { const x = one("s", shown()); if (x) { selves[i] = x; if (pick === i) { pick = -1; clearCase(); } renderAll(); } }
function rerollAll() { const s = fourSelves(shown()); if (s.length === +$("nself").value) { selves = s; pick = -1; clearCase(); renderAll(); } }
function banWord(w) { store.set("bans", [...bans(), w]); bansUI(); }
function bansUI() { $("clr").textContent = "Clear bans (" + bans().size + ")"; }
function addMine(w) {
  if (mine().includes(w)) return;
  $("mine").value = ($("mine").value.trim() + "\n" + w).trim();
  store.set("mine", $("mine").value);
}

function slot(it, tag, onSel, onReroll) {
  const w = el("div", "cw"), s = it.e[3][it.i];
  const c = el(tag, "card");
  c.append(el("div", "word", it.e[0]), el("div", "meta", "(" + NAMES[s[0]] + ") " + s[1]));
  if (onSel) { c.type = "button"; c.onclick = onSel; }
  const t = el("div", "tools");
  if (it.e[3].length > 1) t.append(btn("Meaning " + (it.i + 1) + "/" + it.e[3].length, () => { it.i = (it.i + 1) % it.e[3].length; renderAll(); }));
  t.append(
    btn("Reroll", onReroll),
    btn("Save", b => { addMine(it.e[0]); flash(b, "Saved"); }),
    btn("Ban", () => { banWord(it.e[0]); onReroll(); })
  );
  w.append(c, t);
  return w;
}
function renderAll() {
  $("hbody").replaceChildren(slot(heaven, "div", null, rerollH));
  $("sbody").replaceChildren(...selves.map((it, i) => slot(it, "button", () => { pick = pick === i ? -1 : i; update(); }, () => rerollS(i))));
  update();
}
function update() {
  [...$("sbody").querySelectorAll("button.card")].forEach((b, i) => b.setAttribute("aria-pressed", i === pick));
  const box = $("identity");
  if (pick < 0) {
    box.replaceChildren(el("p", "hint", "Pick a self word to weigh against the heaven word."));
  } else {
    const s = selves[pick];
    const row = el("div", "merged");
    row.append(el("span", "w hw", heaven.e[0]), el("span", "join", "\u25C6"), el("span", "w sw", s.e[0]));
    const defs = el("div", "defs");
    defs.append(el("p", "", heaven.e[0] + ": " + sd(heaven)), el("p", "", s.e[0] + ": " + sd(s)));
    const acts = el("div", "acts");
    acts.append(btn("Save identity", saveId), btn("Copy case for the judge", copyCase),
      btn("Export Markdown", b => { exportCase("md"); flash(b, "Exported"); }),
      btn("Export JSON", b => { exportCase("json"); flash(b, "Exported"); }));
    box.replaceChildren(row, defs, el("p", "interp"), el("p", "ruling"), acts);
  }
  judge();
}
const STOP = new Set(["about", "which", "their", "there", "being", "other", "where", "those", "these", "would", "could", "something", "someone", "anything", "having", "between", "through", "without", "within"]);
function mentions(it, text) {
  const d = (sd(it).toLowerCase().match(/[a-z]{5,}/g) || []).filter(x => !STOP.has(x)).slice(0, 8);
  return [it.e[0], ...d].some(x => text.includes(x.slice(0, 5)));
}
function judge() {
  const box = $("identity"), p = box.querySelector(".interp"), r = box.querySelector(".ruling");
  ang = -6;
  if (p) {
    const id = $("interp").value.trim().toLowerCase();
    p.textContent = $("interp").value.trim();
    const hw = mentions(heaven, id), sw = mentions(selves[pick], id);
    const need = ["cost", "drift"].filter(k => $(k).value.trim().split(/\s+/).filter(Boolean).length < 3);
    if (!id) r.textContent = "The Cosmic Lawyers are waiting. Write how the two words combine.";
    else if (hw && sw) {
      ang = 0;
      r.textContent = need.length ? "Accepted, with conditions: name its " + need.join(" and ") + "." : "Accepted. Both words hold together and the price is clear.";
    } else if (hw) {
      ang = -6;
      r.textContent = "Only the heaven word shows. A bearer with just the shard's concept loses themselves. Bring the self word in.";
    } else if (sw) {
      ang = 6;
      r.textContent = "Only the self word shows. Where does the shard's concept come in?";
    } else {
      ang = -10;
      r.textContent = "Too far-fetched. Neither word can be found in this identity.";
    }
  }
  tilt();
}
function tilt() {
  const wide = matchMedia("(min-width:641px)").matches;
  const sc = $("scale").getBoundingClientRect();
  const l = $("lp").getBoundingClientRect(), r = $("rp").getBoundingClientRect();
  const lc = l.left + l.width / 2 - sc.left, rc = r.left + r.width / 2 - sc.left;
  $("beam").style.left = lc + "px";
  $("beam").style.width = (rc - lc) + "px";
  const dy = (rc - lc) / 2 * Math.sin(ang * Math.PI / 180);
  $("beam").style.transform = "rotate(" + ang + "deg)";
  $("lp").style.transform = wide ? "translateY(" + (-dy) + "px)" : "none";
  $("rp").style.transform = wide ? "translateY(" + dy + "px)" : "none";
}

const cap = w => w.charAt(0).toUpperCase() + w.slice(1);
const norm = x => ({
  heavenWord: x.heavenWord || x.h, heavenDescription: x.heavenDescription || "",
  selfWord: x.selfWord || x.s, selfDescription: x.selfDescription || "",
  identity: x.identity || x.t || "", cost: x.cost || x.c || "", drift: x.drift || x.d || ""
});
function caseObj() {
  const s = selves[pick];
  return {
    heavenWord: heaven.e[0], heavenDescription: sd(heaven),
    selfWord: s.e[0], selfDescription: sd(s),
    identity: $("interp").value.trim(), cost: $("cost").value.trim(), drift: $("drift").value.trim()
  };
}
function toMd(c) {
  const f = v => v || "(not written)";
  return "## " + cap(c.heavenWord) + " + " + cap(c.selfWord) + "\n\n" +
    "**Heaven word:** " + cap(c.heavenWord) + ": " + f(c.heavenDescription) + "\n\n" +
    "**Self word:** " + cap(c.selfWord) + ": " + f(c.selfDescription) + "\n\n" +
    "### Identity\n" + f(c.identity) + "\n\n### Cost\n" + f(c.cost) + "\n\n### Drift\n" + f(c.drift) + "\n";
}
function download(name, text, type) {
  const a = el("a");
  a.href = URL.createObjectURL(new Blob([text], {type}));
  a.download = name;
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
function exportCase(kind) {
  const c = caseObj(), name = c.heavenWord + "-" + c.selfWord;
  if (kind === "md") download(name + ".md", toMd(c), "text/markdown");
  else download(name + ".json", JSON.stringify(c, null, 2), "application/json");
}
function exportSaved(kind) {
  const ids = store.get("ids", []).map(norm);
  if (!ids.length) return;
  if (kind === "md") download("saved-identities.md", "# Saved identities\n\n" + ids.map(c => toMd(c)).join("\n"), "text/markdown");
  else download("saved-identities.json", JSON.stringify(ids, null, 2), "application/json");
}
function saveId(b) {
  const ids = store.get("ids", []);
  ids.unshift(caseObj());
  store.set("ids", ids);
  renderSaved();
  flash(b, "Saved");
}
function renderSaved() {
  const ids = store.get("ids", []);
  $("list").replaceChildren(...(ids.length ? ids.map((raw, i) => {
    const x = norm(raw), d = el("div", "item");
    d.append(el("div", "w2", x.heavenWord + " + " + x.selfWord));
    if (x.identity) d.append(el("p", "", x.identity));
    if (x.cost) d.append(el("p", "", "Cost: " + x.cost));
    if (x.drift) d.append(el("p", "", "Drift: " + x.drift));
    d.append(btn("Delete", () => { ids.splice(i, 1); store.set("ids", ids); renderSaved(); }));
    return d;
  }) : [el("p", "hint", "Nothing saved yet.")]));
}
function copyCase(b) {
  const s = selves[pick];
  const txt = "You are one of the Cosmic Lawyers in the world of Scraps of Heaven. A bearer has fused a heaven word (held by a shard) with a self word, and must form an identity from the two; the identity is how they shape their soul-light into an ability. You judge whether the interpretation holds together or is too far-fetched.\n\n" +
    "Rules: the identity must follow from both words; stretching a word is allowed only if the link is still defensible (that is what Flex measures). The ability needs a clear cost (Strength caps how strong it can be, Size drains as it runs, and overuse causes Leak, Crack or Warp) and a drift (the bearer slowly acts more like their identity, which leads towards corruption, where heaven's light turns them transparent like glass).\n\n" +
    "Heaven word: " + heaven.e[0] + " (" + sd(heaven) + ")\nSelf word: " + s.e[0] + " (" + sd(s) + ")\n" +
    "Identity: " + ($("interp").value.trim() || "(none written yet)") + "\nCost: " + ($("cost").value.trim() || "(none)") + "\nDrift: " + ($("drift").value.trim() || "(none)") +
    "\n\nGive a verdict (accepted, accepted with changes, or too far-fetched), explain briefly, and if needed suggest a tighter version.";
  (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject())
    .then(() => flash(b, "Copied"))
    .catch(() => prompt("Copy this text:", txt));
}

$("mine").value = store.get("mine", "");
$("mine").oninput = () => store.set("mine", $("mine").value);
$("go").onclick = draw;
$("rs").onclick = rerollAll;
["interp", "cost", "drift"].forEach(id => $(id).oninput = judge);
$("clr").onclick = () => { store.set("bans", []); bansUI(); };
["tn", "tv", "ta", "src", "nself", "hs", "ss", "zip", "len", "only"].forEach(id => $(id).onchange = draw);
addEventListener("resize", tilt);
$("sx").append(
  btn("Export all as Markdown", b => { exportSaved("md"); flash(b, "Exported"); }),
  btn("Export all as JSON", b => { exportSaved("json"); flash(b, "Exported"); })
);
renderSaved(); bansUI(); tilt();
load().then(draw).catch(() => $("identity").replaceChildren(el("p", "hint", "Could not load the word list. Try a recent version of Chrome, Safari or Firefox.")));
</script>
</body>
</html>
